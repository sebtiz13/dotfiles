# --- Terminal colors & Ghostty capabilities ---
# Enable 256 colors and full 24-bit TrueColor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard"
set -as terminal-features ",xterm-256color:RGB:extkeys:clipboard"

# --- Quality of Life ---
# Enable full mouse support (scrolling, selecting panes, resizing)
set -g mouse on
# Remove delay when pressing Escape (crucial for Vim/Neovim responsiveness)
set -s escape-time 0
# Enable escape sequence passthrough (critical for OSC 52 copy/paste and image protocols)
set -g allow-passthrough on
# Clipboard Integration (OSC 52)
set -s set-clipboard on
# Increase scrollback buffer size
set -g history-limit 50000
# Listen focus events
set -g focus-events on

# --- Prefix Key ---
# Remap default prefix from Ctrl-b to Ctrl-a (more accessible on Qwerty home row)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload tmux configuration with Prefix + r
bind r source-file "#{config_files}" \; display "Configuration reloaded!"

# Unbind default split shortcuts
unbind '"'
unbind %

# --- Vim-like Splits (like :split and :vsplit) ---
bind s split-window -v -c "#{pane_current_path}"  # horizontal split (like :split)
bind v split-window -h -c "#{pane_current_path}"  # vertical split (like :vsplit)

# --- Pane Navigation & Resizing (Vim-style) ---
# Navigate panes with h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind X kill-window
bind x kill-pane

# Resize panes with ctrl + H, J, K, L (repeatable using -r flag)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# --- Vim-like Pane Moving ---
bind H select-pane -m \; select-pane -L \; swap-pane \; select-pane -L \; select-pane -M
bind J select-pane -m \; select-pane -D \; swap-pane \; select-pane -D \; select-pane -M
bind K select-pane -m \; select-pane -U \; swap-pane \; select-pane -U \; select-pane -M
bind L select-pane -m \; select-pane -R \; swap-pane \; select-pane -R \; select-pane -M

# --- Pane Movement ---
bind B break-pane  # Move pane to new window (like ! to break out)
bind M command-prompt -p "join pane to window:" "join-pane -t ':%%'"  # Move to specific window

# --- Window Navigation ---
# Quick window cycling using < and > keys
bind -r < previous-window
bind -r > next-window

# --- Copy Mode ---
# Use vi keybindings in copy mode
setw -g mode-keys vi

# Selection and copy workflow matching Vim
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# --- Status Bar & Aesthetics ---
set -g status on                    # Enable status bar
set -g status-justify centre        # Center window list

# Status colors
set -g status-style bg=default,fg=colour8
set -g status-left "#[bold,fg=colour4] [#S] "
set -g status-right '#[fg=colour7]%H:%M #[fg=colour8]| #[fg=colour2]#(hostname) '

# Window tab formatting in the center
setw -g window-status-format "#[fg=colour8] #I:#W "
setw -g window-status-current-format "#[bold,fg=colour5] [#I:#W] "

# --- TMUX plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'

# Github format example
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# Other git format example
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
