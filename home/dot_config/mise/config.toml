[settings]
idiomatic_version_file_enable_tools = ["python", "node"]

# Trust mise config in Developpement directory
trusted_config_paths = [
    '~/Development/*',
]

env_file = '.env'
experimental = true

[tools]
chezmoi = "2.73.0"
flux2 = "2.9.6"
"github:alltuner/mise-completions-sync" = "latest"
helm = "4.3.0"
kubectl = "1.37.1"
pi = { version = "1.0.0", postinstall = "npx pi-completion zsh > ${XDG_DATA_HOME:-$HOME/.local/share}/mise-completions/zsh/_pi" }
shellcheck = "0.11.0"
uv = "0.12.22"

[hooks]
postinstall = "misecompsync --shell zsh"
